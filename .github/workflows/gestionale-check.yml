name: Gestionale checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/gestionale-usability-email]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:gestionale
      - run: npm run test:gestionale:sql
